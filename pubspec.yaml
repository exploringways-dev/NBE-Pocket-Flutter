name: nbe_app
description: NBE-style Login & Sign Up UI clone (Flutter)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Optional, only needed if you want native Face ID / fingerprint prompts.
  # Not required for the UI itself.
  local_auth: ^2.3.0
  http: ^1.2.0
  flutter_secure_storage: ^9.0.0
  vector_math: ^2.4.2
  app_links: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
